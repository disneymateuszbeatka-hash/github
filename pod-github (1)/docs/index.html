    <!-- GitHub Pages Trailing Slash & Static Branch Deployment Fallback -->
    <script>
      (function() {
        if (typeof window === 'undefined' || !window.location) return;
        var loc = window.location;
        // 1. Ensure trailing slash for folder subpaths on GitHub Pages so relative './assets/...' loads properly
        if (loc.pathname.length > 1 && !loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
          loc.replace(loc.pathname + '/' + loc.search + loc.hash);
          return;
        }
        // 2. If raw unbuilt root index.html is served directly on GitHub Pages branch root, redirect to compiled /docs/
        if (loc.hostname.endsWith('github.io') && !loc.pathname.includes('/docs')) {
          var repoPath = loc.pathname.endsWith('/') ? loc.pathname : loc.pathname + '/';
          loc.replace(repoPath + 'docs/' + loc.search + loc.hash);
        }
      })();
    </script>
